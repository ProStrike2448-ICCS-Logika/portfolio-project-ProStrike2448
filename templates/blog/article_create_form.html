{% extends "../base.html" %}
{% block content %}
  <form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    {% for field in form %}
      <div class="fieldWrapper">
        {{ field.errors }}
        {{ field.label_tag }} {{ field }}
        {% if field.name == 'categories' %}
          <a href="{% url "blog:category-create" %}">+</a>
        {% elif field.name == 'tags' %}
          <a href="{% url "blog:tag-create" %}">+</a>
        {% endif %}
      </div>
    {% endfor %}
    <button type="submit">Create</button>
  </form>
{% endblock content %}
