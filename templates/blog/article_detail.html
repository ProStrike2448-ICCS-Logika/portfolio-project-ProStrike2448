{% extends "../base.html" %}
{% block title %}
  {{ article.title }}
{% endblock title %}
{% block content %}
  <h1>{{ article.title }}</h1>
  <p>{{ article.content }}</p>
  <p>Status: {{ article.status }}</p>
  <p>Date created: {{ article.created_date|date:"d.m.Y" }}</p>
  <a href="{% url "blog:article-list" %}">Go back</a>
{% endblock content %}
