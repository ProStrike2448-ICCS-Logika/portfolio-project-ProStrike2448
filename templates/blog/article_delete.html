{% extends "../base.html" %}
{% block content %}
  <form method="post">
    {% csrf_token %}
    <p>Are you sure you want to delete "{{ article }}"?</p>
    {{ form.as_div }}
    <button type="submit">Yes</button>
  </form>
  <a href="{% url "blog:article-detail" article.pk %}">No</a>
{% endblock content %}
