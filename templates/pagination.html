<nav aria-label="Page navigation">
  <ul class="pagination justify-content-center mt-3">
    <li class="page-item {% if not page_obj.has_previous %}disabled{% endif %}">
      <a class="page-link"
         {% if page_obj.has_previous %}href="?page={{ page_obj.previous_page_number }}"{% endif %}
         aria-label="Previous">
        <span aria-hidden="true">«</span>
      </a>
    </li>
    {% for i in page_obj.paginator.page_range %}
      <li class="page-item {% if page_obj.number == i %}active{% endif %}">
        <a class="page-link" href="?page={{ i }}">{{ i }}</a>
      </li>
    {% endfor %}
    <li class="page-item {% if not page_obj.has_next %}disabled{% endif %}" id="next-page">
      <a class="page-link"
         {% if page_obj.has_next %}href="?page={{ page_obj.next_page_number }}"{% endif %}
         aria-label="Next">
        <span aria-hidden="true">»</span>
      </a>
    </li>
  </ul>
</nav>
